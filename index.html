<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hold’em Drill">
<title>Endless Hold’em Drill</title>
<style>
@font-face{font-family:"Fraunces";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/fraunces-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Fraunces";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/fraunces-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/instrument-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/instrument-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/instrument-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/instrument-sans-latin-700-normal.woff2") format("woff2")}
:root{
  --bg:#e9f0eb; --surface:#ffffff; --surface-2:#f4f8f5; --ink:#12241b; --muted:#53665b; --line:#cbd8cf; --track:#d3ded6;
  --felt:#1f6045; --felt-2:#2b7a57; --felt-3:#164a34; --felt-ink:#ffffff; --good:#1f6045; --good-bg:#d9eee1;
  --bad:#a62a2a; --bad-bg:#f6dcdc; --card:#fffdf8; --card-ink:#17201b; --card-red:#c4262d; --txt-red:#c4262d; --gold:#d9a53a;
  --shadow:0 1px 2px rgba(18,36,27,.06),0 6px 20px rgba(18,36,27,.07);
  /* Fraunces for headings, numbers and card ranks; Instrument Sans for everything else (the owner's choice).
     Both are bundled in fonts/ (SIL Open Font License), so the app works offline and loads nothing from outside. */
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1a13; --surface:#13271d; --surface-2:#102219; --ink:#e8f1ec; --muted:#9db3a6; --line:#274436; --track:#2f4a3d;
    --felt:#1d6b4b; --felt-2:#2a8a62; --felt-3:#123d2b; --felt-ink:#f4fff9; --good:#7fd3a6; --good-bg:#17382a;
    --bad:#ff9a9a; --bad-bg:#3b1c1c; --txt-red:#ff8a8f; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1a13; --surface:#13271d; --surface-2:#102219; --ink:#e8f1ec; --muted:#9db3a6; --line:#274436; --track:#2f4a3d;
  --felt:#1d6b4b; --felt-2:#2a8a62; --felt-3:#123d2b; --felt-ink:#f4fff9; --good:#7fd3a6; --good-bg:#17382a;
  --bad:#ff9a9a; --bad-bg:#3b1c1c; --txt-red:#ff8a8f; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:10px 12px 112px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13.5px}

/* Top bar */
.top{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo{flex:none;width:30px;height:30px;display:block}
h1{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:baseline;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill b{font-family:var(--serif);font-size:15px;color:var(--ink)}
.pill.hot b{color:var(--gold)}
.iconbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tsize{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 12px 6px}
.tshead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.tshead b{font-size:13.5px;font-weight:600;color:var(--ink)}
.dual{position:relative;height:28px;margin:0 -10px}
#tstrack{position:absolute;left:22px;right:22px;top:50%;height:6px;margin-top:-3px;border-radius:6px;background:var(--line)}
#tsfill{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--felt-2)}
.dual input{position:absolute;left:0;top:50%;width:100%;height:44px;margin:-22px 0 0;padding:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input:focus-visible{outline:none}
.dual input::-webkit-slider-runnable-track{height:44px;background:none;border:0}
.dual input::-moz-range-track{height:44px;background:none;border:0}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:44px;height:44px;border:0;border-radius:50%;cursor:grab;background:radial-gradient(circle closest-side,var(--card) 0 44%,var(--gold) 47% 59%,transparent 62%)}
.dual input::-moz-range-thumb{pointer-events:auto;width:44px;height:44px;border:0;border-radius:50%;cursor:grab;background:radial-gradient(circle closest-side,var(--card) 0 44%,var(--gold) 47% 59%,transparent 62%)}
.dual input:focus-visible::-webkit-slider-thumb{background:radial-gradient(circle closest-side,var(--card) 0 44%,var(--gold) 47% 76%,transparent 79%)}
.dual input:focus-visible::-moz-range-thumb{background:radial-gradient(circle closest-side,var(--card) 0 44%,var(--gold) 47% 76%,transparent 79%)}
#tsticks{display:flex;justify-content:space-between;margin:0 12px;cursor:pointer}
#tsticks span{width:0;display:flex;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);opacity:.65;font-variant-numeric:tabular-nums}
#tsticks span.on{color:var(--ink);opacity:1}

/* Spot card */
.scene{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.felt{position:relative;padding:12px 14px 14px;color:#eef8f2;
  background:radial-gradient(120% 90% at 50% 0%,var(--felt-2) 0%,var(--felt) 55%,var(--felt-3) 100%)}
.felt::after{content:"";position:absolute;inset:0;pointer-events:none;border-bottom:1px solid rgba(0,0,0,.15);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px)}
.felt>*{position:relative;z-index:1}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topic{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.tag{font-size:12.5px;font-weight:600;color:#eef8f2;background:rgba(0,0,0,.2);border-radius:999px;padding:2px 10px;white-space:nowrap}
.seats{display:flex;gap:5px;margin-top:10px}
.seat{flex:1;position:relative;text-align:center;background:rgba(0,0,0,.18);color:#eaf6ef;border-radius:999px;padding:3px 2px;line-height:1.1;min-width:0}
.seat .sname{display:block;font-weight:700;font-size:13px}
.seat .sub{display:block;font-size:10.5px;min-height:12px;opacity:.85}
.seat.you{background:var(--card);color:#12241b;box-shadow:0 0 0 2px var(--gold)}
.seat.fold{opacity:.4}
.seat.acted{box-shadow:inset 0 0 0 1.5px rgba(217,165,58,.8)}
.seats.many{gap:3px}
.seats.many .sname{font-size:10.5px;letter-spacing:-.3px}
.seats.many .sub{font-size:9px;min-height:10px}
.seats.many .dealer{width:13px;height:13px;font-size:8.5px;top:-5px;right:-1px}
.again{color:#eef8f2;font-weight:600}
.memo{display:flex;gap:8px;margin-top:6px}
.memo span{flex:1;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px 4px;font-size:12px;color:var(--muted)}
.memo b{display:block;font-family:var(--serif);font-size:19px;color:var(--ink)}
.memo-line{font-weight:600}
.dealer{position:absolute;top:-6px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#3a2a00;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.act{margin-top:10px;font-size:15px;font-weight:500;line-height:1.45}
.act .r{color:#ffb1b4}
.cards{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.cards .lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(238,248,242,.7);width:46px}
.badge{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold);border:1.5px solid rgba(217,165,58,.6);border-radius:8px;padding:1px 8px;margin-left:4px}
.pc{width:40px;height:56px;border-radius:7px;background:var(--card);color:var(--card-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.05;box-shadow:0 2px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.18);animation:deal .22s ease-out both}
.pc:nth-child(3){animation-delay:.03s}.pc:nth-child(4){animation-delay:.06s}.pc:nth-child(5){animation-delay:.09s}.pc:nth-child(6){animation-delay:.12s}
.pc.r{color:var(--card-red)}
.pc .ten{letter-spacing:-1.5px}
.pc small{font-size:18px;font-family:var(--sans);font-weight:500}
@keyframes deal{from{opacity:0;transform:translateY(-6px) rotate(-2deg)}to{opacity:1;transform:none}}
.r{color:var(--txt-red)}
.qa{padding:12px 14px 14px}
.q{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.3}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{font:inherit;font-size:16px;text-align:left;padding:11px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;min-height:48px;display:flex;gap:12px;align-items:center;transition:transform .08s,border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--felt-2)}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1.5px solid var(--line);border-radius:7px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.opt.good{border-color:var(--good);background:var(--good-bg)} .opt.good .k{border-color:var(--good);color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .k{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.linkbtn{font:inherit;font-size:13.5px;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 0 0;min-height:36px}
.exp{margin-top:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);animation:pop .18s ease-out}
.exp b{display:block;font-size:16px}
.exp.good{background:var(--good-bg);border-color:var(--good)} .exp.good b{color:var(--good)}
.exp.bad{background:var(--bad-bg);border-color:var(--bad)} .exp.bad b{color:var(--bad)}
.es{margin-top:10px;line-height:1.55;font-size:15.5px}
.es:first-of-type{margin-top:6px}
.eh{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Range chart */
.rg-wrap{margin-top:14px}
.rg-title{font-size:13px;font-weight:600;margin-bottom:6px}
.rg{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;max-width:420px}
.rc{font-size:8.5px;font-weight:600;text-align:center;padding:4px 0;border-radius:3px;line-height:1.1;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
@media (min-width:400px){.rc{font-size:9.5px}}
.rc.in{background:var(--felt);color:var(--felt-ink)}
.rc.p{background:#b8432f;color:#fff}
.rc.out{background:var(--line);color:var(--muted)}
.rc.hl{outline:2.5px solid var(--gold);position:relative;z-index:1}
.rg-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-top:8px;align-items:center}
.rg-leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rg-leg i.in{background:var(--felt)} .rg-leg i.p{background:#b8432f} .rg-leg i.out{background:var(--line)}

/* Bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);z-index:5}
#bar[hidden]{display:none}
#bar .in{max-width:560px;margin:0 auto}
.btn{font:inherit;font-weight:700;font-size:17px;width:100%;padding:14px 18px;border-radius:14px;border:0;background:linear-gradient(180deg,var(--felt-2),var(--felt));color:var(--felt-ink);cursor:pointer;min-height:52px;box-shadow:0 6px 16px rgba(31,96,69,.3)}
.btn.alt{background:transparent;color:var(--muted);border:1.5px solid var(--line);font-size:14px;font-weight:600;min-height:42px;padding:8px;box-shadow:none;margin-top:14px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.foot{margin-top:12px;text-align:center}
.iconbtn[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.top{gap:8px}
.drillbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--gold);font-size:13.5px;font-weight:600}
.drillbar .chip{min-height:44px}
.modebar{display:flex;gap:8px;margin-top:16px} .modebar .chip.small{flex:1;min-height:44px;font-weight:600}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
.hrow i{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:#fff;background:var(--good)} .hrow i.no{background:var(--bad)}
.hrow small{display:block;font-size:12.5px;color:var(--muted)}
.dbtns{display:flex;gap:6px;flex:none}
.learn{margin-top:12px}
.lsizes{display:grid;gap:4px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:9px;background:transparent;color:var(--muted);min-height:44px;cursor:pointer}
.seg[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:8px;overflow:hidden}
.lcard summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;min-height:48px;cursor:pointer;font-weight:600;list-style:none}
.lcard summary::-webkit-details-marker{display:none}
.lcard summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px}
.lcard[open] summary::after{transform:rotate(-135deg)}
.lcard summary span{flex:1}
.lcard summary small{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}
.lcard summary b{font-family:var(--serif);color:var(--gold)}
.lbody{padding:0 14px 14px}
.lbody .es:first-child{margin-top:0}
.ldrill{margin-top:14px;box-sizing:border-box}
.ver{text-align:center;margin-top:4px;font-size:12px;opacity:.8}

/* Settings sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,15,10,.45)}
#sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;max-height:calc(100% - 62px - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.phead{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.phead h2{font-family:var(--serif);font-size:21px;margin:0}
.sec{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink);font-weight:600}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip.small{font-size:13px;min-height:34px;padding:5px 10px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;padding:6px 0;font:inherit;font-size:15px;color:var(--ink);background:none;border:0;text-align:left;cursor:pointer}
.tgl+.tgl{border-top:1px solid var(--line)}
.tgl small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tgl .sw{flex:none;position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background .2s}
.tgl .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.tgl[aria-checked="true"] .sw{background:var(--felt)}
.tgl[aria-checked="true"] .sw::after{transform:translateX(18px)}
.tgl:disabled{opacity:.45;cursor:not-allowed}
.tgl:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){.tgl .sw,.tgl .sw::after{transition:none}}
.trow{display:grid;grid-template-columns:1fr 90px 40px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
/* The empty part of a bar or ring must read as a track, so it uses a visible tint, not the faint border colour. */
.bar{height:8px;background:var(--track);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;min-width:8px;border-radius:8px;background:var(--felt-2)}
.pct{text-align:right;color:var(--muted)}
.miss{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.mt{font-size:12px;color:var(--muted);font-weight:700}
.mh{font-weight:600}
.ma{color:var(--good);font-weight:600;margin:2px 0}
.miss .es,.miss .eh{display:none}
.miss .es:first-of-type{display:block;font-size:14px;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.exp,.pc,.panel{animation:none}.opt{transition:none}}
@media (hover:none){.hint{display:none}}
@media (max-width:380px){h1{font-size:17px}.pill{padding:3px 8px}}

/* ===================== v3 layout ===================== */
#app{max-width:560px;margin:0 auto;padding:8px 12px calc(150px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:9px;min-height:44px}
.top h1{flex:none;font-size:21px}
#hslot{margin-left:auto;display:flex;align-items:center;gap:6px;min-width:0}
.sztext{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill{padding:5px 11px}
.page{margin-top:8px}
.lead{font-size:14.5px;color:var(--muted)}
.ltabs{margin:0 0 12px}
.lprog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}

.ldots i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.ldots i.on{background:var(--good)}
.lpage{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:16px;line-height:1.55}
.lpage>small{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--good)}

.ltip span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.lnav{display:flex;gap:8px;margin-top:12px}
.lnav .btn{margin-top:0}
.lnav .btn.alt{flex:0 0 34%;min-height:52px;font-size:15px}
.lres{text-align:center;border-radius:18px;padding:22px 16px;border:1.5px solid var(--line);margin-bottom:6px}
.lres.good{background:var(--good-bg);border-color:var(--good)} .lres.bad{background:var(--bad-bg);border-color:var(--bad)}

.gtable div+div{border-top:1px solid var(--line)}
.gtable span{color:var(--muted)}
.gtable b{font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Bottom navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(0px,calc((100% - 560px)/2)) env(safe-area-inset-bottom,0px)}
.nav button{font:inherit;font-size:11px;font-weight:600;min-height:56px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.nav button[aria-current="page"]{color:var(--good)}

/* The spot: table, your cards, the action */
.spot{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 12px 12px;box-shadow:var(--shadow)}
.shead{display:flex;align-items:center;gap:8px;min-height:22px}
.shead .topic{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--good)}

.rbadge{margin-left:auto;font-size:11.5px;font-weight:700;color:#3a2a00;background:var(--gold);border-radius:999px;padding:2px 9px}
.ptable{position:relative;height:164px;margin-top:4px}
.oval{position:absolute;left:4%;right:4%;top:12%;bottom:12%;border-radius:999px;
  background:radial-gradient(90% 120% at 50% 35%,var(--felt-2) 0%,var(--felt) 55%,var(--felt-3) 100%);

.spot .act{margin-top:10px;font-size:14.5px;line-height:1.45;font-weight:500;color:var(--ink)}
.spot .act .r{color:var(--txt-red)}
.spot .badge{margin-left:4px}

/* Question and answers */
.qa{padding:12px 2px 0}

.verdict.good{background:var(--good-bg);border-color:var(--good)}
.verdict.bad{background:var(--bad-bg);border-color:var(--bad)}
.vi{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;background:var(--felt)}
.verdict.bad .vi{background:#a62a2a}
.verdict b{display:block;font-size:16px}
.verdict.good b{color:var(--good)} .verdict.bad b{color:var(--bad)}
.verdict span:not(.vi){display:block;font-weight:600;font-size:15px}
.verdict small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.why{margin-top:12px;font-size:15.5px;line-height:1.55}
.more{margin-top:10px;border-top:1px solid var(--line)}
.more summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;cursor:pointer;list-style:none;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.more summary::-webkit-details-marker{display:none}
.more[open] summary svg{transform:rotate(180deg)}
.more>div{font-size:15.5px;line-height:1.55;padding-bottom:4px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 16px;text-align:center}
.empty .btn{margin-top:14px}

/* Progress */
.statrow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.ring{position:relative;flex:none;width:84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.rbg{stroke:var(--track)} .rfg{stroke:var(--good)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring b{font-family:var(--serif);font-size:20px}
.ring span,.statcol span{font-size:11.5px;color:var(--muted)}
.statcol{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.statcol b{display:block;font-family:var(--serif);font-size:23px}
.trow2{display:grid;grid-template-columns:1fr 84px 42px;gap:10px;align-items:center;width:100%;min-height:48px;padding:4px 12px;margin-top:6px;font:inherit;font-size:14.5px;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.trow2:disabled{opacity:.45;cursor:not-allowed}
.trow2 .tn{font-weight:600}
.trow2 .tnone{grid-column:2/4;text-align:right;font-size:12.5px;color:var(--muted)}
.bar i.blow{background:#c4262d} .bar i.bmid{background:var(--gold)}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:6px}
.mcard summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:6px 12px;cursor:pointer;list-style:none;font-size:14px}
.mcard summary::-webkit-details-marker{display:none}
.mcard summary small{display:block;font-size:13px;color:var(--muted)}
.mcard[open] summary svg{transform:rotate(180deg)}
.mcard>div{padding:0 12px 12px;font-size:14.5px;line-height:1.5}
.mcard p+p{margin-top:6px}

/* Settings */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.rowbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;padding:8px 0;font:inherit;font-size:15px;text-align:left;color:var(--ink);background:none;border:0;cursor:pointer}
.rowbtn span{flex:1}
.rowbtn small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.rowbtn b{font-size:13.5px;font-weight:600;color:var(--good);white-space:nowrap}
.rowbtn svg{transform:rotate(-90deg);color:var(--muted)}
.sec .count{text-transform:none;letter-spacing:0;font-weight:500;margin-left:4px}
.ver{line-height:1.6;margin-top:18px}
.panel{max-height:none;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel .tsize{border:0;padding:0;background:none;margin-top:14px}
.panel .btn{margin-top:18px}
.sizenote{font-size:14.5px;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion: reduce){.verdict{animation:none}}
@media (max-width:359px){.statcol b{font-size:19px}.top h1{font-size:19px}}
</style>

<body>
<div id="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"> <defs><linearGradient id="hdFelt" x1="0.3" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#2b7a57"/><stop offset="1" stop-color="#164a34"/></linearGradient></defs> <rect width="100" height="100" rx="22" fill="url(#hdFelt)"/> <g fill="#d9a53a"><circle cx="50" cy="36" r="11"/><circle cx="38" cy="54" r="11"/><circle cx="62" cy="54" r="11"/><circle cx="50" cy="50" r="6"/><path d="M48.6 52Q48.4 66 41 73H59Q51.6 66 51.4 52Z"/></g> </svg>
    <h1 id="ptitle">Practice</h1>

  </header>
  <main id="page" class="page"></main>
</div>
<div id="bar" hidden><div class="in"><button class="btn" id="nextbtn" data-act="next">Next spot →</button></div></div>
<nav class="nav" id="nav" aria-label="Sections">
  <button data-nav="practice"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="10" height="14" rx="2"/><path d="M9 4h9a2 2 0 0 1 2 2v12"/></svg>Practice</button>
  <button data-nav="learn"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5c-.8 0-1.5.7-1.5 1.5zM20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5.7 1.5 1.5z"/></svg>Learn</button>
  <button data-nav="progress"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>Progress</button>
  <button data-nav="settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>Settings</button>
</nav>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Table size">
  <div class="panel">
    <div class="phead"><h2>Table size</h2><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div>
    <p class="sizenote">Drag either handle, or tap a number. Put both handles on one number to practice a single table size.</p>
    <div class="tsize" id="tsize" role="group" aria-label="Table size">
      <div class="tshead"><span>Spots are dealt for</span><b id="tsval"></b></div>
      <div class="dual"><div id="tstrack"><i id="tsfill"></i></div>
        <input type="range" id="tsA" min="2" max="9" step="1" value="2" aria-label="Table size, one end of the range">
        <input type="range" id="tsB" min="2" max="9" step="1" value="4" aria-label="Table size, other end of the range">
      </div>

    </div>
    <button class="btn" data-act="close">Done</button>
  </div>
</div>
<script>

/* ===================== Cards ===================== */
var RANKS="23456789TJQKA", SUITS=["♠","♥","♦","♣"];
var PL={14:"aces",13:"kings",12:"queens",11:"jacks",10:"tens",9:"nines",8:"eights",7:"sevens",6:"sixes",5:"fives",4:"fours",3:"threes",2:"twos"};
var SG={14:"ace",13:"king",12:"queen",11:"jack",10:"ten",9:"nine",8:"eight",7:"seven",6:"six",5:"five",4:"four",3:"three",2:"two"};
function rc(v){return RANKS[v-2];}
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function cs(c){return rc(c.v)+SUITS[c.s];}
function deck(){var d=[];for(var v=2;v<=14;v++)for(var s=0;s<4;s++)d.push({v:v,s:s});return d;}
function dealFrom(n,used){
  var u={};(used||[]).forEach(function(c){u[c.v+"_"+c.s]=1;});
  var d=shuffle(deck().filter(function(c){return !u[c.v+"_"+c.s];}));
  return d.slice(0,n);
}
function parse(str,perm){return str.split(" ").map(function(t){var v=RANKS.indexOf(t[0])+2,s=SUITS.indexOf(t.slice(1));return {v:v,s:perm?perm[s]:s};});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* ===================== Hand evaluator ===================== */
function eval5(c){
  var vs=c.map(function(x){return x.v;}).sort(function(a,b){return b-a;});
  var flush=c.every(function(x){return x.s===c[0].s;});
  var cnt={};vs.forEach(function(v){cnt[v]=(cnt[v]||0)+1;});
  var groups=Object.keys(cnt).map(Number).sort(function(a,b){return cnt[b]-cnt[a]||b-a;});
  var uniq=Object.keys(cnt).map(Number).sort(function(a,b){return b-a;});
  var sh=0;
  if(uniq.length===5){
    if(uniq[0]-uniq[4]===4)sh=uniq[0];
    else if(uniq[0]===14&&uniq[1]===5&&uniq[4]===2)sh=5;
  }
  if(sh&&flush)return [8,sh];
  var g0=cnt[groups[0]];
  if(g0===4)return [7,groups[0],groups[1]];
  if(g0===3&&cnt[groups[1]]===2)return [6,groups[0],groups[1]];
  if(flush)return [5].concat(vs);
  if(sh)return [4,sh];
  if(g0===3)return [3].concat(groups);
  if(g0===2&&cnt[groups[1]]===2)return [2].concat(groups);
  if(g0===2)return [1].concat(groups);
  return [0].concat(vs);
}
function cmp(a,b){for(var i=0;i<Math.max(a.length,b.length);i++){var x=a[i]||0,y=b[i]||0;if(x!==y)return x-y;}return 0;}
function best(cards){
  var bestS=null,n=cards.length;
  for(var a=0;a<n;a++)for(var b=a+1;b<n;b++)for(var c=b+1;c<n;c++)for(var d=c+1;d<n;d++)for(var e=d+1;e<n;e++){
    var s=eval5([cards[a],cards[b],cards[c],cards[d],cards[e]]);
    if(!bestS||cmp(s,bestS)>0)bestS=s;
  }
  return bestS;
}
function hname(s){
  var k=s.slice(1).map(rc).join(" ");
  switch(s[0]){
    case 8:return "Straight flush, "+SG[s[1]]+"-high";
    case 7:return "Four "+PL[s[1]];
    case 6:return cap(PL[s[1]])+" full of "+PL[s[2]];
    case 5:return "Flush ("+k+")";
    case 4:return "Straight, "+SG[s[1]]+"-high";
    case 3:return "Three "+PL[s[1]]+", kickers "+rc(s[2])+" "+rc(s[3]);
    case 2:return "Two pair, "+PL[s[1]]+" and "+PL[s[2]]+", "+rc(s[3])+" kicker";
    case 1:return "Pair of "+PL[s[1]]+", kickers "+rc(s[2])+" "+rc(s[3])+" "+rc(s[4]);
    default:return "High card ("+k+")";
  }
}

/* ===================== Ranges ===================== */
function hc(a,b){var hi=Math.max(a.v,b.v),lo=Math.min(a.v,b.v);return {hi:hi,lo:lo,pair:hi===lo,suited:a.s===b.s&&hi!==lo,label:hi===lo?rc(hi)+rc(hi):rc(hi)+rc(lo)+(a.s===b.s?"s":"o")};}
function all(min){var o={};for(var v=3;v<=14;v++)o[v]=min||2;return o;}
/* One chart per seat. A seat's range depends on who is still to act, not on the table size,
   so the button (or any other seat) plays the same chart at every table size.
   {at, s:{topRank:minKicker}, o:{...}}. Pairs are always in. */
var CH={
  /* Raise first in */
  UTG:{at:"under the gun",s:{14:10,13:10,12:10,11:10,10:9},o:{14:12,13:12}},
  UTG1:{at:"from UTG+1",s:{14:9,13:10,12:10,11:10,10:9,9:8},o:{14:11,13:12}},
  MP:{at:"from middle position",s:{14:2,13:9,12:10,11:10,10:9,9:8},o:{14:11,13:12}},
  LJ:{at:"from the lojack",s:{14:2,13:8,12:9,11:9,10:8,9:8,8:7},o:{14:10,13:11}},
  HJ:{at:"from the hijack",s:{14:2,13:5,12:8,11:8,10:8,9:7,8:6,7:6,6:5},o:{14:9,13:10,12:10,11:10}},

  {t:"Re-raising a raise (3-bet)",sum:"About 3x their raise",drill:"Facing a raise",
    rows:[["In position","Re-raise to 15 (3x)"],["From the big blind","Re-raise to 16"],["From the small blind","Re-raise to 18"],["Against a cutoff, button or small-blind raise","JJ+, AK, AQ"],["Against a raise from the hijack or earlier","QQ+, AK only"],["Heads-up big blind","99+, AQ+"]],
    why:"Re-raise the hands that are ahead of the raiser’s range, and go bigger when you will be out of position, so they pay more to use their position. The earlier the raiser’s seat, the stronger their range and the fewer hands are good enough. Hands like TT or AJs are usually calls: a re-raise folds out the worse hands and keeps in the better ones."},
  {t:"When they re-raise you (4-bet or not)",sum:"4-bet to 2.3x with QQ+, AK",drill:"Facing 3-bets",

    why:"Home-game players mostly re-raise with QQ+, AK, AQ and JJ. Judge your hand against that range, not against the hand you thought you had when you opened. A 4-bet does not need to be big: 2.3 times their raise already commits them to a decision for their stack."},
  {t:"Betting the flop after you raised",sum:"1/3 pot dry, 3/4 pot wet",drill:"Flop c-bets",
    rows:[["Dry board","Bet about 1/3 pot"],["Wet board (draws possible)","Bet about 3/4 pot"],["Two pair or better","Big on wet, either size on dry"],["Top pair or overpair","Small on dry, big on wet"],["Second pair","Small on dry, check on wet"],["Weaker pairs","Check"],["Nothing","Small on dry, check on wet"],["Against two callers","Only top pair or better bets"]],
    why:"On a dry board little can outdraw you, so a small bet keeps worse hands in and makes cheap bluffs work. On a wet board draws have real equity, so bet big to charge them. Check the hands that are neither strong enough to bet for value nor weak enough to bluff."},
  {t:"Raising a river bet",sum:"About 2.5x their bet",drill:"River vs big bets",
    rows:[["Size","About 2.5x their bet"],["If that is most of your stack","All-in instead"],["A set","Raise, but only call a solid player when a straight is possible"],["Top two pair","Call a solid player; call or raise a bluffer or a small bet"],["One pair","Never raise. Fold to a solid player’s big bets"]],
    why:"A river raise is only for hands that beat most of what calls it. 2.5 times wins much more than a call and is still small enough for worse two pairs and sets to pay. Bigger than that, and only better hands call."},

    rows:[["Against a player who bets whenever you check","Check your strong hands, then raise to about 3x"],["Against a passive player","Bet yourself: they won’t bet for you"]],
    why:"A check-raise lets an aggressive player put money in with hands that would have folded to your bet. Against players who check back, it just gives a free card."},
  {t:"Short stack (6-12 big blinds)",sum:"All-in or fold",drill:"All-in decisions",

/* ===================== Lessons ===================== */
/* The course in the Learn tab. Each lesson is a few short pages and then a quiz of real spots from the matching
   topic. A page has a heading h, body text p (HTML), and optionally rows (a two-column table, or a function that
   returns one, so numbers come from the charts), chart (an RSPEC key) and tip (the one line to remember).
   quiz: topic, n spots, pass mark, an optional test(g) to keep only the spots the lesson is about, and
   need3 when the lesson needs at least three players. Every number repeats a rule in CLAUDE.md. */
function pctRow(label,k){return [label,"About "+chartPct(CH[RSPEC[k].ch])+"%"];}
function guideRows(title){for(var i=0;i<RAISE_GUIDE.length;i++)if(RAISE_GUIDE[i].t===title)return RAISE_GUIDE[i].rows;return [];}
var UNITS=["Before the flop","Poker math","After the flop","All-in","Beating your game"];
var LESSONS=[
 {id:"position",unit:0,t:"Position: why your seat matters",quiz:{topic:"Preflop ranges",n:6,pass:5,test:function(g){return /^(size|in|out)\|/.test(g.sk)&&RSPEC[g.rkey].verb==="open";}},pages:[
  {h:"Seats are named from the button",p:"<p>The button acts last on every street after the flop. That is the best seat at the table, so every other seat is named by how far it is from the button.</p><p>The <b>cutoff</b> is one seat before the button, the <b>hijack</b> two, the <b>lojack</b> three. The small blind and big blind sit after the button.</p><p>A smaller table just loses its earliest seats. A 4-handed table is cutoff, button, small blind, big blind. A 3-handed table starts at the button.</p>"},
  {h:"Fewer players behind you, wider range",p:"<p>When you are first to put money in, every player still to act is another chance that someone holds a better hand. So the fewer players are left behind you, the more hands you can raise.</p>",
   rows:function(){return [pctRow("Under the gun (8 behind)","UTG"),pctRow("Lojack (5 behind)","LJ"),pctRow("Hijack (4 behind)","HJ"),pctRow("Cutoff (3 behind)","CO"),pctRow("Button (2 behind)","BTN"),pctRow("Small blind (1 behind)","SB")];},
   tip:"A seat plays the same range at every table size. What counts is who is left to act."},
  {h:"Acting last is worth money",p:"<p>After the flop, the player who acts last sees what everyone else does before deciding. They can take a free card when checked to, bet when the others show weakness, and keep the pot small with a medium hand.</p><p>That is why the small blind opens <i>fewer</i> hands than the button, even though only one player is left behind it: it plays the whole hand out of position.</p>",
   tip:"Two questions before every preflop decision: how many players are left to act, and will I act last after the flop?"}]},
 {id:"open",unit:0,t:"Opening: raise or fold",quiz:{topic:"Preflop opens",n:8,pass:6},pages:[
  {h:"First in, you raise or you fold",p:"<p>When nobody has entered the pot, you have two plays: raise or fold. Never limp.</p><p>A raise can win the blinds right away, and when it gets called you have the lead going to the flop. A limp can do neither: it lets the blinds in cheaply and wins nothing when everyone else folds.</p>",
   rows:function(){return guideRows("Opening raise");},tip:"One size for every hand you open, so the size never gives your hand away."},
  {h:"The button: about half of all hands",p:"<p>On the button only the two blinds are left, and you act last after the flop. Raise about half of all hands: every pair, every suited ace and king, most suited cards that connect, and offsuit hands with two decent cards.</p>",chart:"BTN",
   tip:"Learn the edges, not the list: for each top card, the weakest kicker you play."},
  {h:"The small blind: tighter, and bigger",p:"<p>The small blind has one player left but plays out of position, so it opens fewer hands and raises to 6 instead of 5. Offsuit hands need high cards (K7o+, Q9o+, J9o+). Weak offsuit connectors like 65o fold: out of position they rarely make enough to win.</p>",chart:"SB"},
  {h:"Earlier seats: tighten up",p:"<p>From the cutoff, three players are behind you and the button has position on you, so the range drops to about a third of hands. Every seat earlier than that drops again.</p><p>The hands that go first are the weak offsuit ones. On the button K8o is a raise. From the cutoff it makes a top pair that a better king beats too often.</p>",chart:"CO"}]},
 {id:"bb",unit:0,t:"Defending the big blind",quiz:{topic:"Big blind defense",n:8,pass:6},pages:[
  {h:"You get a discount",p:"<p>You have already posted 2. Against a raise to 5 you pay 3 more to play for a pot of 11, so you need to win only about 27% of the time. You also act last before the flop, so nobody can raise behind you.</p><p>That price is why the big blind defends more hands than any other seat calls with.</p>",
   tip:"The 2 you posted is already in the pot. Only the 3 more matters."},
  {h:"The earlier the raiser, the tighter you defend",p:"<p>A button raise is made with half of all hands. A raise from an early seat is made with the best 12%. Your hand has to do well against the hands they actually hold.</p>",
   rows:function(){return [pctRow("Against a button raise","BBvBTN"),pctRow("Against a small-blind raise","BBvSB"),pctRow("Against a cutoff raise","BBvCO"),pctRow("Against a hijack or lojack raise","BBvMID"),pctRow("Against an earlier raise","BBvEP"),pctRow("Heads-up","BBHU")];}},
  {h:"What you defend against the button",p:"<p>Every suited hand, every pair, any ace, and offsuit hands down to K5o, Q8o, J8o, T8o, 98o and 87o. Weak offsuit hands like K2o or 95o fold even at this price, because out of position they rarely get to showdown.</p>",chart:"BBvBTN"},
  {h:"When to re-raise instead of calling",p:"<p>Re-raise to 16 with the hands that are ahead of the raiser’s range. Call with the rest of your defending hands.</p>",
   rows:[["Against a cutoff, button or small-blind raise","JJ+, AK, AQ"],["Against a hijack, lojack or earlier raise","QQ+, AK"],["Heads-up","99+, AQ+"]],
   tip:"A re-raise builds the pot while you are ahead and takes the lead, so you are not just the caller out of position."}]},
 {id:"vsraise",unit:0,t:"Facing a raise",quiz:{topic:"Facing a raise",n:8,pass:6,need3:true},pages:[
  {h:"Calling needs a better hand than raising",p:"<p>When someone has already raised, a strong range is in the pot. A hand you would happily open yourself can now be a fold.</p><p>You have three plays: re-raise the hands that are ahead of the raiser, call the hands that can flop something big, and fold the rest.</p>"},
  {h:"Re-raise: which hands, how much",p:"<p>Re-raise to about 3 times their raise, and a little bigger from the small blind, where you will be out of position.</p>",
   rows:function(){return guideRows("Re-raising a raise (3-bet)").slice(0,5);},
   tip:"Hands like TT or AJs are usually calls. A re-raise folds out the worse hands and keeps in the better ones."},
  {h:"Call: hands that flop big",p:"<p><b>In position</b>, call with the other pairs (to hit a set), suited broadway cards, any suited ace, suited connectors from 54s to T9s, and AQo. Against a cutoff raise, also AJo and KQo.</p><p><b>From the small blind</b>, drop the speculative suited hands: call with pairs, suited broadway and AQo. Against a cutoff or button raise, also AJo and KQo.</p>",chart:"CCL"},
  {h:"Fold: the hands that look good",p:"<p>A9o, KTo and QJo look playable, and they are the most expensive calls in poker. They make top pair with the second-best kicker, so when the money goes in after the flop you are usually the one paying.</p>",
   tip:"If your hand’s best result is top pair with a weak kicker, fold it to a raise."}]},
 {id:"limps",unit:0,t:"Punishing limpers",quiz:{topic:"Facing limps",n:8,pass:6},pages:[
  {h:"A limp is a weak hand",p:"<p>Players raise their best hands, so a limper rarely has one. Raising your strong hands over a limp builds the pot while you are ahead and usually gets you heads-up with the lead.</p>",
   rows:function(){return guideRows("Raising over limpers");},tip:"Go bigger than a normal raise. Limpers love to call."},
  {h:"What to do in each seat",p:"<p><b>Big blind:</b> raise the strong hands, check everything else. Never fold when checking is free.</p><p><b>Small blind:</b> raise the strong hands. With small pairs and suited connectors, completing for 1 more or folding are both fine. Fold the rest.</p><p><b>With position on the limper:</b> raise the strong hands, limp behind with small pairs, suited connectors and one-gappers, fold the rest.</p>"},
  {h:"Don’t raise weak hands to isolate",p:"<p>Callers with medium hands hit the flop often. If you raise K7o to isolate a limper and get called, you are playing a bloated pot with a hand that makes second-best pairs.</p><p>Speculative hands are the opposite: they want a cheap, multiway pot, where a set or a flush gets paid by several players.</p>"}]},
 {id:"vs3bet",unit:0,t:"When they re-raise you",quiz:{topic:"Facing 3-bets",n:8,pass:6},pages:[
  {h:"Judge your hand against their range",p:"<p>Home-game players re-raise with a narrow range: roughly QQ+, AK, AQ and JJ. Your opening hand now has to do well against <i>those</i> hands, not against a random one.</p>",
   rows:function(){return guideRows("When they re-raise you (4-bet or not)").slice(0,4);}},
  {h:"The 1/10 rule for small pairs",p:"<p>A small pair or a suited connector flops a big hand only about 1 time in 6 to 8. To profit you must win about 10 times the call when you hit.</p><p>So call only when the call is at most 1/10 of the stacks: about 20 with 200 behind. If it costs more, fold.</p>",
   tip:"Cost 20 or less: call and try to flop a set. More: fold."},
  {h:"The 5 you already put in is gone",p:"<p>The most common mistake here is calling because you already raised. That money belongs to the pot now. The only question is whether the next call makes money, and with AJo or KQo against QQ+, AK and AQ it does not.</p>"}]},
 {id:"odds",unit:1,t:"Pot odds",quiz:{topic:"Pot odds",n:8,pass:7},pages:[
  {h:"What a call has to earn",p:"<p>When you call, you risk the bet to win everything in the middle, including your own call.</p><p><b>Equity you need = call ÷ (pot + bet + call).</b></p><p>Example: the pot is 60 and they bet 30. You call 30 to win 120, so you need 30 ÷ 120 = 25%.</p>"},
  {h:"Memorize the prices",p:"<p>Every bet size has a fixed price. Learn them once and stop calculating at the table.</p>",
   rows:[["1/4 pot","17%"],["1/3 pot","20%"],["1/2 pot","25%"],["2/3 pot","29%"],["3/4 pot","30%"],["Pot","33%"]],tip:"Half pot needs a quarter. Pot needs a third."},
  {h:"The bluffer’s side",p:"<p>A bluff risks the bet to win the pot. It breaks even when they fold <b>bet ÷ (pot + bet)</b> of the time.</p>",
   rows:[["1/3 pot","25%"],["1/2 pot","33%"],["2/3 pot","40%"],["Pot","50%"]],
   tip:"Small bluffs need to work less often. That is why a small bet on a dry flop is profitable, and why bluffing a player who never folds is not."}]},
 {id:"draws",unit:1,t:"Draws: outs and equity",quiz:{topic:"Draws & equity",n:8,pass:6},pages:[
  {h:"Count your outs",p:"<p>An out is a card that makes your hand.</p>",
   rows:[["Flush draw","9 outs"],["Open-ended straight draw","8 outs"],["Gutshot","4 outs"],["Flush draw + open-ended","15 outs"],["Two overcards","6 outs"]]},
  {h:"Turn outs into equity",p:"<p>With <b>one card to come</b>, multiply your outs by 2. A flush draw on the turn is about 18%.</p><p>On the flop, multiply by 4 <b>only when you will see both cards for one price</b>, which means the opponent is all-in. If they can bet again on the turn, your flop call buys one card, so use 2.</p>",
   tip:"×2 for one card. ×4 only when they are all-in on the flop."},
  {h:"Compare equity with the price",p:"<p>Call when your equity is higher than the price from the last lesson.</p><p>Example: on the turn you have a flush draw (18%) and they bet half the pot (25% needed). Fold. If they bet a quarter of the pot (17% needed), call.</p><p>Money you expect to win later when you hit can justify a slightly worse price, but only against players who pay off.</p>"}]},
 {id:"cbet",unit:2,t:"Betting the flop after you raised",quiz:{topic:"Flop c-bets",n:8,pass:6,test:function(g){return !g.mw;}},pages:[
  {h:"Read the board first: wet or dry",p:"<p>A <b>dry</b> board has few draws: K-7-2 with three suits. Whoever is ahead now usually stays ahead.</p><p>A <b>wet</b> board has draws: three cards of one suit, three cards close in rank like 9-8-6, or two of a suit with two cards close together. Many turn cards change who is winning.</p>",
   tip:"Dry board: bet small. Wet board: bet big or check."},
  {h:"What each hand does",p:"<p>Against one caller:</p>",rows:function(){return guideRows("Betting the flop after you raised").slice(2,7);}},
  {h:"Why weak pairs check",p:"<p>With 77 on K-J-6, a bet folds out the hands you beat and gets called only by kings and jacks. You turned a hand with showdown value into a bluff.</p><p>Check it. You keep the pot small, see the turn for free, and often win at showdown.</p>",
   tip:"Bet for value when worse hands call. Bluff when better hands fold. Check when neither is true."}]},
 {id:"multiway",unit:2,t:"Pots with two callers",quiz:{topic:"Flop c-bets",n:6,pass:5,need3:true,test:function(g){return g.mw;}},pages:[
  {h:"Two callers changes everything",p:"<p>In your game most raised pots have more than one caller. With two opponents it is twice as likely that someone hit the flop, and a bluff has to get through both of them.</p>"},
  {h:"The rule: no bluffs, no thin bets",p:"<p>Against two callers, bet only top pair or better.</p>",
   rows:[["Two pair or better","Bet: big on wet boards, either size on dry"],["Top pair or overpair","Bet: small on dry, big on wet"],["Second pair or weaker","Check"],["Nothing","Check, even on a dry board"]],
   tip:"The more players see the flop, the stronger the hand you need to bet."}]},
 {id:"river",unit:2,t:"Big river bets and one pair",quiz:{topic:"River vs big bets",n:8,pass:6,test:function(g){return g.kind==="top"||g.kind==="two";}},pages:[
  {h:"Top pair wins small pots",p:"<p>This is the most expensive habit in home games: calling big bets on every street because “it’s top pair.”</p><p>By the river, a player who bet big three times is telling you something. Big pots are usually won by two pair or better.</p>"},
  {h:"List the worse hands that bet this way",p:"<p>Before you call, name the hands you beat that would bet big on the flop, the turn and the river. Against a solid player who rarely bluffs, the list is almost empty: they have two pair, a set, or a straight.</p>",
   rows:[["Solid player, big bets on three streets","Fold top pair"],["Same player, you have top two pair","Call"],["A player who has shown bluffs","Call top pair"],["A small river bet","Call top pair: the price is great"]]},
  {h:"Who is betting matters most",p:"<p>A friend who usually just calls and suddenly bets or raises big almost always has it. Passive players do not turn into bluffers on the river.</p><p>A friend who has shown two bluffs tonight is a different opponent. Against them top pair beats enough of their range to call.</p>",
   tip:"The same hand is a fold against one player and a call against another. Decide who you are facing before you look at the price."}]},
 {id:"riverraise",unit:2,t:"Getting paid with strong hands",quiz:{topic:"River vs big bets",n:6,pass:5,test:function(g){return g.kind==="set"||(g.kind==="two"&&g.vil!=="solid");}},pages:[
  {h:"Raise when worse hands will call",p:"<p>A river raise is for hands that beat most of what calls it. A set usually qualifies: worse two pairs and smaller sets pay you.</p>",rows:function(){return guideRows("Raising a river bet");}},
  {h:"Check for the straight first",p:"<p>Look at the board for three cards that fit inside a five-card run, like 9-7-6 or A-4-3. If a straight is possible and a solid player has bet big on every street, just call with a set: a raise gets called only by the straight.</p><p>Wheels are the ones people miss. On A-4-3, a player holding 5-2 has a straight.</p>",
   tip:"Set + no straight possible: raise. Set + straight possible + solid player: call."}]},
 {id:"shove",unit:3,t:"Short stacks: shove or fold",quiz:{topic:"All-in decisions",n:8,pass:6,test:function(g){return !!g.rkey;}},pages:[
  {h:"With 6 to 12 big blinds, there are two plays",p:"<p>A normal raise puts in a big part of a short stack and leaves you unable to fold to a re-raise. So below about 12 big blinds you either move all-in or fold.</p><p>A shove wins two ways: everyone folds and you take the blinds, or you get called and win the showdown.</p>"},
  {h:"How wide to shove from each seat",p:"<p>The fewer players behind you, the wider you shove.</p>",rows:function(){return guideRows("Short stack (6-12 big blinds)").slice(1);},
   tip:"Never min-raise and fold, and never limp, when you are short."}]},
 {id:"callshove",unit:3,t:"Calling an all-in",quiz:{topic:"All-in decisions",n:8,pass:6,test:function(g){return !g.rkey;}},pages:[
  {h:"Before the flop: who is shoving?",p:"<p>Calling a 100 big blind shove needs about 49% equity, a coin flip. Whether your hand has that depends on the hands this player shoves with.</p>",
   rows:[["A tight player (QQ+, AK)","Call only AA and KK"],["A typical player (TT+, AQ+)","Call QQ+ and AK"],["A maniac","Call much lighter: 99+, AJ+"]],
   tip:"QQ and AK are folds against a tight player’s shove. They are a coin flip or worse against that range."},
  {h:"After the flop: how deep are the stacks?",p:"<p>Divide the stack left by the pot. That is the stack-to-pot ratio.</p>",
   rows:[["About 1 or less","Top pair is enough to call"],["3 or more, against a solid player","Two pair or better"],["3 or more, against a maniac","Top pair can still call"]],
   tip:"The deeper the stacks, the stronger the hand you need to put them all in."}]},
 {id:"adapt",unit:4,t:"Adjusting to each player",quiz:{topic:"Adaptation",n:8,pass:6},pages:[
  {h:"Three adjustments cover most players",p:"<p>Every rule so far is a starting point. The money comes from changing your play to fit the person in front of you.</p>",
   rows:[["They fold too much","Bluff and steal more"],["They bluff too much","Call more"],["They call too much","Value bet more, bluff less"]]},
  {h:"Your friends adjust to you too",p:"<p>If you have folded all night, your raises get respect: steal more blinds and fire more small bets. If you have been caught bluffing, they will call you lighter: bet your good hands bigger and bluff less.</p><p>Watch for players who play differently against you than against others. That is someone who has adapted, and they usually overdo it.</p>",
   tip:"Adjust to how a player plays against you tonight, not to how they played last month."}]},
 {id:"value",unit:4,t:"Value betting players who call too much",quiz:{topic:"Adaptation",n:6,pass:5,test:function(g){return /^(thin|size|check|bluff)\|/.test(g.sk);}},pages:[
  {h:"Where the money is in your game",p:"<p>Friends who limp and call a lot do not fold to bluffs, and they pay off value bets. So bluff them less, and bet your good hands more often and bigger.</p><p>On the river with top pair, ask one question: will a worse hand call? Against a player who calls with any pair, bet. Against a tight player who only calls with two pair or better, check and show it down.</p>",
   tip:"Being ahead is not enough to bet. A worse hand has to call."},
  {h:"Pick the size they will call",p:"<p>Against someone who calls any size, bet big. Against someone who folds to big bets but calls small ones, bet small: a small bet that gets called beats a big bet that does not.</p>"},
  {h:"Let aggressive players bet for you",p:"<p>With a strong hand against a player who bets every time you check, check and then raise to about 3 times their bet. Against a passive player who checks back, bet yourself: they will not do it for you.</p>"}]}

function lessonById(id){for(var i=0;i<LESSONS.length;i++)if(LESSONS[i].id===id)return LESSONS[i];return null;}
/* Table sizes a lesson's quiz can use, from the sizes being practiced. */
function lessonSizes(L,sizes){var fm=G[L.quiz.topic].fmts;if(!fm)return [null];return fm.filter(function(f){return sizes.indexOf(f)>=0&&!(L.quiz.need3&&f==="2");});}
function lessonSpot(L,f){
  var q=L.quiz;
  for(var i=0;i<3000;i++){var g=G[q.topic].gen(f);if(g&&(!q.test||q.test(g))){g.topic=q.topic;g.fm=f;return g;}}
  return null;
}

/* ===================== Skills ===================== */
/* A skill is the piece of knowledge a spot tests: a seat's chart, a hand class on a board texture, a pot-odds
   fraction. Reviews ask the same skill again with new cards, so you learn the rule, not the one hand. */
function skillOf(g){
  if(g.sk)return g.topic+"|"+g.sk;
  if(g.rkey)return g.topic+"|"+g.rkey;
  return g.topic+"|"+(g.you||g.tag||"")+"|"+g.o.filter(function(o){return o.ok;}).map(function(o){return o.t.split(" ")[0];}).join("/");
}
/* Prefers a spot that differs from the last one (avoid = its explanation). Some skills only have one spot,
   like "what share does the cutoff open", so a fresh copy of the same question is the fallback. */
function variant(topic,f,skill,avoid){
  var same=null;
  for(var i=0;i<2000;i++){var g=G[topic].gen(f);if(!g)continue;g.topic=topic;g.fm=f;
    if(skillOf(g)!==skill)continue;if(!avoid||g.e!==avoid)return g;if(!same)same=g;}
  return same;
}

/* ===================== State ===================== */
/* Shown at the bottom of the page and the menu, so you can tell when a new release has loaded.
   v must match the cache name in sw.js (holdem-drill-X.Y.Z); the tests check it. Small fix: bump Z. New feature:
   bump Y. Big change: bump X. at is the release time in UTC, shown in the phone's own time zone. */
var BUILD={v:"2.4.0",at:"2026-11-12T16:46Z"};
function buildText(){
  var d=new Date(BUILD.at),t;
  try{t=d.toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});}catch(e){t=BUILD.at;}
  return "v"+BUILD.v+" · built "+t;

    return '<details class="mcard"><summary><span><b>'+m.topic+(m.tag?' · '+m.tag:'')+'</b>'+(m.hand?'<small>'+color(m.hand)+(m.board?' on '+color(m.board):'')+'</small>':'')+'</span>'+CHEV+'</summary><div>'+(m.act?'<p>'+color(m.act)+'</p>':'')+'<p class="ma">✓ '+color(m.ans)+'</p><p class="muted">'+color(why)+'</p></div></details>';
  }).join("")+'<button class="linkbtn" data-act="clearmiss">Clear this list</button>':'<p class="muted small">No mistakes yet. The last 20 show up here.</p>';
  return h;
}
function tgl(k,on,label,sub,dis){return '<button class="tgl" role="switch" data-tgl="'+k+'" aria-checked="'+on+'"'+(dis?" disabled":"")+'><span>'+label+(sub?"<small>"+sub+"</small>":"")+'</span><span class="sw" aria-hidden="true"></span></button>';}
function renderSettings(){
  var th=st.theme||"dark",dk=document.documentElement.getAttribute("data-theme")!=="light";
  var onCount=TOPICS.filter(function(t){return st.on[t]&&available(t);}).length;
  var h='<div class="sec">Table</div><div class="group"><button class="rowbtn" data-act="size"><span>Table size<small>Spots are dealt for these table sizes. Tap to change.</small></span><b>'+sizeLabel(st.lo,st.hi)+'</b>'+CHEV+'</button></div>';
  h+='<div class="sec">Topics <span class="count">'+onCount+' of '+TOPICS.length+' on</span></div><div class="chips" style="margin-bottom:8px"><button class="chip small" data-act="all">Select all</button><button class="chip small" data-act="none">Clear</button></div>'+
    '<div class="chips">'+TOPICS.map(function(t){var av=available(t);return '<button class="chip" data-topic="'+t+'" aria-pressed="'+(!!st.on[t]&&av)+'"'+(av?'':' disabled title="Not available for the selected table sizes"')+'>'+t+'</button>';}).join("")+'</div>';
  h+='<div class="sec">Appearance and sound</div><div class="group">'+tgl("dark",dk,"Dark mode","",th==="auto")+tgl("auto",th==="auto","Match device","Follow your phone’s light or dark setting.")+tgl("sound",st.sound!==false,"Sound","Cards and chips: fold, check, call, raise and all-in each have their own sound.")+'</div>';
  h+='<div class="sec">Your data</div><p class="muted small">Stats, reviews and lesson progress are saved on this phone only.</p><button class="btn alt" data-act="reset">Reset all stats</button>';
  h+='<p class="muted small ver">Blinds 1/2 · 200-chip stacks unless stated<br>'+buildText()+'</p>';
  return h;
}
/* Draws the header, the current page and the bottom navigation. */
function render(){
  $("ptitle").textContent=TITLES[view];
  var chip='<span class="sztext">'+sizeShort(st.lo,st.hi)+'</span>';
  $("hslot").innerHTML=view==="practice"?chip+'<div class="pill'+(st.streak>=5?' hot':'')+'" aria-label="Streak"><b>'+st.streak+'</b><span>streak</span></div>':view==="learn"?chip:"";
  $("page").className="page "+view;
  $("page").innerHTML=view==="practice"?renderQ():view==="learn"?renderLearn():view==="progress"?renderProgress():renderSettings();
  var nb=$("nav").children;for(var i=0;i<nb.length;i++){if(nb[i].dataset.nav===view)nb[i].setAttribute("aria-current","page");else nb[i].removeAttribute("aria-current");}
  $("bar").hidden=!(view==="practice"&&cur&&picked!==null);
  var last=focus&&focus.i>=focus.n;
  $("nextbtn").textContent=focus&&focus.h?(last?"See the hand →":"Next street →"):focus&&(focus.q||focus.w)&&last?"See your result →":"Next spot →";
  tsPaint(st.lo,st.hi);
}
function setView(v){
  view=v;
  if(v==="practice"&&!done&&(!cur||(cur.f&&!inRange(cur.f))||(!cur.drill&&(!st.on[cur.topic]||!available(cur.topic)))))return next();
  render();try{window.scrollTo(0,0);}catch(e){}
}
function weighted(on){
  var ws=on.map(function(t){return 0.2+2*st.ew[t];});
  var tot=ws.reduce(function(a,b){return a+b;},0),x=Math.random()*tot;
  for(var i=0;i<on.length;i++){x-=ws[i];if(x<=0)return on[i];}return on[on.length-1];
}
function isDue(x){var L=LADDER[x.box];return L.n!==undefined?st.n>=x.due:Date.now()>=x.due;}
function schedule(x){var L=LADDER[x.box];x.due=L.n!==undefined?st.n+L.n+rnd(2):Date.now()+L.h*3600000;}
function plain(g){var c={};Object.keys(g).forEach(function(k){if(k!=="rv"&&k!=="drill"&&k!=="box"&&k!=="memo")c[k]=g[k];});return c;}
/* Missed: start the skill at box 0 with this exact spot. */
function missed(g){
  var k=skillOf(g),x={box:0,g:plain(g),ver:BUILD.v,f:g.fm===undefined?(g.f||null):g.fm};schedule(x);st.rev[k]=x;
  var ks=Object.keys(st.rev);if(ks.length>40){ks.sort(function(a,b){return st.rev[b].box-st.rev[a].box;});delete st.rev[ks[0]];}
}
/* Answered a review: climb the ladder, or start again. Returns where the skill went, for the feedback line. */
function reviewed(g,ok){
  var k=g.rv,x=st.rev[k];if(!x)return "";
  if(!ok){missed(g);return "This one comes back in a few spots.";}
  x.box++;
  if(x.box>=LADDER.length){delete st.rev[k];st.mastered++;return "Mastered. This skill is off your review list.";}
  x.g=plain(g);x.ver=BUILD.v;schedule(x);var L=LADDER[x.box];
  return "Next review: "+(L.n!==undefined?"in about "+L.n+" spots, with new cards.":L.h<24?"tomorrow.":"in "+Math.round(L.h/24)+" days.");
}
/* Keeps the same-session queue short: when more than REV_MAX of those reviews are due, the oldest move to tomorrow. */
function trimDue(){
  var ks=Object.keys(st.rev).filter(function(k){var x=st.rev[k];return x.box<DAYBOX&&isDue(x);}).sort(function(a,b){return st.rev[a].due-st.rev[b].due;});
  while(ks.length>REV_MAX){var x=st.rev[ks.shift()];x.box=DAYBOX;schedule(x);}
}
function usable(x){return st.on[x.g.topic]&&available(x.g.topic)&&(x.f===null||inRange(x.f));}
function next(){
  done=null;
  var on=TOPICS.filter(function(t){return st.on[t]&&available(t);}),W=focus&&focus.w;
  if(W&&!on.length)focus=W=null;
  if(!on.length&&!focus){cur=null;picked=null;render();return;}
  var g=null;
  /* A drill deals from one chart (started in Learn) or one topic (started in Progress) until you stop it. */
  if(focus&&focus.h){g=JSON.parse(JSON.stringify(focus.h[focus.i]));g.drill=true;}
  else if(focus&&focus.q){var QL=lessonById(focus.q),qs=lesQuizSizes(QL);if(qs.length)g=lessonSpot(QL,pick(qs));if(g)g.drill=true;}
  else if(focus&&focus.t){var ff=G[focus.t].fmts?pick(G[focus.t].fmts.filter(inRange)):null;for(var q=0;q<40&&!g;q++)g=G[focus.t].gen(ff);if(g){g.topic=focus.t;g.fm=ff;g.drill=true;}}
  else if(focus&&!W){g=drillSpot(focus.k,focus.f);if(g)g.drill=true;}
  if(focus&&!g&&!W)focus=null;
  if(!g&&!on.length){cur=null;picked=null;render();return;}
  if(!g){
    /* Due reviews, lowest box first (freshest mistakes matter most). At least REV_GAP new spots come between two
       reviews, however many are waiting, so most of a session is new spots. */
    trimDue();
    var due=Object.keys(st.rev).filter(function(k){return isDue(st.rev[k])&&usable(st.rev[k]);}).sort(function(a,b){return st.rev[a].box-st.rev[b].box||st.rev[a].due-st.rev[b].due;});
    if(due.length&&(W||sinceRev>=REV_GAP)){
      var k=due[0],x=st.rev[k];
      var vf=x.f===null&&G[x.g.topic].fmts?pick(G[x.g.topic].fmts.filter(inRange)):x.f;
      /* Box 0 shows the exact spot again, but only if it was saved by this version: a spot saved by an older
         version can carry old wording (a question that once left out the table size), so deal it fresh. */
      g=x.box===0&&x.ver===BUILD.v?JSON.parse(JSON.stringify(x.g)):(variant(x.g.topic,vf,k,x.box===0?null:x.g.e)||JSON.parse(JSON.stringify(x.g)));
      g.rv=k;g.box=x.box;
    }
  }
  if(!g){
    /* A warm-up deals from your three weakest topics. */
    var t=W?pick(on.slice().sort(function(a,b){return st.ew[b]-st.ew[a];}).slice(0,3)):weighted(on),def=G[t],f=null;
    if(def.fmts)f=pick(def.fmts.filter(inRange));
    for(var i=0;i<20&&!g;i++)g=def.gen(f);
    if(!g)return next();
    g.topic=t;g.fm=f;
  }
  if(g.rv){sinceRev=0;delete g.drill;}else if(!g.drill)sinceRev++;
  if(W)g.drill=true;
  if(!g.fixed){var idx=shuffle(g.o.map(function(_,i){return i;}));g.o=idx.map(function(i){return g.o[i];});}
  cur=g;picked=null;render();if(g.hand)sfx("deal");try{window.scrollTo(0,0);}catch(e){}
}
/* ===================== Sound ===================== */
/* Table sounds made with Web Audio: card flicks for a new spot, chips for a call, bet or raise, a pile of chips for
   an all-in, two knocks for a check, a card slide for a fold. Off with the Sound switch in Settings. */
var AC=null,NOISE=null;
function audio(){
  if(st.sound===false)return null;
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
      NOISE=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);var d=NOISE.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(AC.state==="suspended")AC.resume();
    return AC;
  }catch(e){return null;}
}
/* A burst of filtered noise: the body of every card and chip sound. */
function hiss(ac,t,dur,freq,q,vol,type,slideTo){
  var src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=NOISE;f.type=type||"bandpass";f.frequency.setValueAtTime(freq,t);if(slideTo)f.frequency.exponentialRampToValueAtTime(slideTo,t+dur);f.Q.value=q;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(ac.destination);src.start(t,Math.random()*.2,dur+.02);
}
/* A short pitched tick: the ring of a clay chip, or a knuckle on the table. */
function tick(ac,t,freq,dur,vol,type,slideTo){
  var o=ac.createOscillator(),g=ac.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(freq,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.003);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
function chip(ac,t,vol){var f=2300+Math.random()*1500;tick(ac,t,f,.05,vol*.5,"triangle");tick(ac,t,f*1.48,.035,vol*.25);hiss(ac,t,.03,5200,1.2,vol*.5);}
function sfx(kind){
  var ac=audio();if(!ac)return;
  try{
    var t=ac.currentTime+.01,i;
    if(kind==="deal"){hiss(ac,t,.09,2600,.9,.22,"bandpass",1500);hiss(ac,t+.09,.09,2900,.9,.2,"bandpass",1700);}
    else if(kind==="fold"){hiss(ac,t,.22,1900,.7,.2,"bandpass",500);hiss(ac,t+.05,.2,1500,.7,.12,"bandpass",420);}
    else if(kind==="check"){tick(ac,t,150,.09,.5,"sine",75);hiss(ac,t,.03,900,1,.1);tick(ac,t+.13,140,.09,.45,"sine",70);hiss(ac,t+.13,.03,900,1,.09);}
    else if(kind==="call"){chip(ac,t,.3);chip(ac,t+.07,.26);}
    else if(kind==="raise"){for(i=0;i<5;i++)chip(ac,t+i*.055+Math.random()*.012,.3-i*.02);}
    else if(kind==="allin"){hiss(ac,t,.35,3200,.6,.14,"bandpass",1400);for(i=0;i<12;i++)chip(ac,t+i*.038+Math.random()*.02,.3);tick(ac,t+.5,120,.12,.35,"sine",60);}
    else tick(ac,t,620,.05,.12,"triangle");
  }catch(e){}
}
/* Which sound an answer makes, from its wording. */
function sfxFor(text){
  return /all-in/i.test(text)?"allin":/^Fold/.test(text)?"fold":/^Check/.test(text)?"check":/^Call/.test(text)?"call":/^(Bet|Raise|Re-raise|4-bet)/.test(text)?"raise":"tap";
}
function answer(i){
  if(picked!==null||!cur)return;picked=i;var ok=cur.o[i].ok;
  sfx(sfxFor(cur.o[i].t));
  st.n++;st.by[cur.topic][1]++;st.ew[cur.topic]=st.ew[cur.topic]*.8+(ok?0:.2);
  if(cur.rv)cur.memo=reviewed(cur,ok);
  else if(!ok){missed(cur);cur.memo="This one comes back in a few spots.";}
  if(ok){st.c++;st.by[cur.topic][0]++;st.streak++;if(st.streak>st.bestStreak)st.bestStreak=st.streak;}
  else{st.streak=0;try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}
    st.miss.push({topic:cur.topic,tag:cur.f?FN[cur.f]:cur.tag,hand:cur.hand?cur.hand.map(cs).join(" "):"",board:cur.board?cur.board.map(cs).join(" "):"",act:cur.act||"",
      ans:cur.o.filter(function(o){return o.ok;}).map(function(o){return o.t;}).join(" or "),e:cur.e});
    if(st.miss.length>20)st.miss.shift();}
  if(focus&&(focus.q||focus.w||focus.h)){focus.i++;if(ok)focus.ok++;
    if(focus.h){focus.res.push(ok);if(!ok&&focus.i<focus.n)cur.memo=(cur.memo?cur.memo+" ":"")+"The hand goes on as if you had made the right play.";}}
  save();render();
  var x=document.querySelector(".verdict");if(x&&x.scrollIntoView)x.scrollIntoView({block:"nearest",behavior:"smooth"});
}

/* ===================== Table-size sheet ===================== */
/* Two range inputs share one track. Either handle can be either end: the smaller value is always the low end,
   so the handles can cross and never block each other. */
var tsA=$("tsA"),tsB=$("tsB");
function tsPaint(lo,hi){
  $("tsval").textContent=sizeLabel(lo,hi);
  var fill=$("tsfill");fill.style.left=(lo-2)/7*100+"%";fill.style.width=(hi-lo)/7*100+"%";
  [tsA,tsB].forEach(function(el){el.setAttribute("aria-valuetext",FN[el.value]);});
  var tk=$("tsticks").children;for(var i=0;i<tk.length;i++)tk[i].className=(i+2>=lo&&i+2<=hi)?"on":"";
}
function tsRead(){var a=+tsA.value,b=+tsB.value;return [Math.min(a,b),Math.max(a,b)];}
function tsCommit(){
  var v=tsRead();if(v[0]===st.lo&&v[1]===st.hi)return;
  st.lo=v[0];st.hi=v[1];save();
  if(focus&&(focus.t?!available(focus.t):!inRange(focus.f)))focus=null;
  if(view==="practice")setView("practice");else render();
}
tsA.value=st.lo;tsB.value=st.hi;
[tsA,tsB].forEach(function(el){
  el.addEventListener("input",function(){var v=tsRead();tsPaint(v[0],v[1]);});
  el.addEventListener("change",tsCommit);
  el.addEventListener("pointerdown",function(){tsA.style.zIndex=el===tsA?3:2;tsB.style.zIndex=el===tsB?3:2;});
});
/* A tap on the track or on a number moves the nearer handle there. */
$("tsize").addEventListener("click",function(e){
  if(e.target===tsA||e.target===tsB)return;
  var r=$("tstrack").getBoundingClientRect(),v=Math.max(2,Math.min(9,Math.round(2+7*(e.clientX-r.left)/r.width)));
  var a=+tsA.value,b=+tsB.value,el=Math.abs(a-v)<=Math.abs(b-v)?tsA:tsB;
  el.value=v;var n=tsRead();tsPaint(n[0],n[1]);tsCommit();
});

document.addEventListener("click",function(e){
  if(e.target.id==="sheet"){$("sheet").hidden=true;return;}
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.nav){if(b.dataset.nav!==view)setView(b.dataset.nav);else try{window.scrollTo({top:0,behavior:"smooth"});}catch(e2){}return;}
  if(b.dataset.tgl){var k=b.dataset.tgl,on=b.getAttribute("aria-checked")!=="true";
    if(k==="sound"){st.sound=on;if(on)sfx("raise");}
    else if(k==="dark")st.theme=on?"dark":"light";
    else st.theme=on?"auto":(document.documentElement.getAttribute("data-theme")==="light"?"light":"dark");
    save();applyTheme();render();return;}
  if(b.dataset.topic){st.on[b.dataset.topic]=!st.on[b.dataset.topic];save();render();return;}
  if(b.dataset.i!==undefined){answer(+b.dataset.i);return;}
  if(b.dataset.lf){st.lf=b.dataset.lf;save();render();return;}
  if(b.dataset.lv){st.lv=b.dataset.lv;les=null;save();render();try{window.scrollTo(0,0);}catch(e3){}return;}
  if(b.dataset.drill){focus={k:b.dataset.drill,f:b.dataset.f};view="practice";next();return;}
  if(b.dataset.tdrill){focus={t:b.dataset.tdrill,from:view};view="practice";next();return;}
  var a=b.dataset.act;
  if(b.dataset.lesson){les={id:b.dataset.lesson,page:lesState(b.dataset.lesson).page||0};st.lv="lessons";render();try{window.scrollTo(0,0);}catch(e4){}return;}
  if(a==="lclose"){les=null;render();try{window.scrollTo(0,0);}catch(e5){}return;}
  if(a==="lread"){les={id:les.id,page:0};render();try{window.scrollTo(0,0);}catch(e6){}return;}
  if(a==="lprev"||a==="lnextpage"){les.page=(les.page||0)+(a==="lprev"?-1:1);st.les=st.les||{};var lx=st.les[les.id]=lesState(les.id);lx.page=les.page;save();render();try{window.scrollTo(0,0);}catch(e7){}return;}
  if(a==="lquiz"){startQuiz(les.id);return;}
  if(a==="hand"){startHand();return;}
  if(a==="warm"){startWarm();return;}
  if(a==="enddone"){next();return;}
  if(a==="stopdrill"){if(focus&&focus.q){les={id:focus.q,page:0};focus=null;cur=null;picked=null;st.lv="lessons";setView("learn");return;}focus=null;next();return;}
  if(a==="tocharts"){setView(focus&&focus.from||"learn");return;}
  if(a==="size"){$("sheet").hidden=false;return;}
  if(a==="close"){$("sheet").hidden=true;return;}
  if(a==="next")advance();
  else if(a==="all"||a==="none"){TOPICS.forEach(function(t){st.on[t]=a==="all";});save();render();}
  else if(a==="clearmiss"){st.miss=[];save();render();}
  else if(a==="reset"){if(!confirm("Reset all your stats?"))return;st.n=0;st.c=0;st.streak=0;st.bestStreak=0;st.miss=[];st.rev={};st.mastered=0;st.les={};TOPICS.forEach(function(t){st.by[t]=[0,0];st.ew[t]=.5;});save();render();}
});
document.addEventListener("toggle",function(e){
  var d=e.target;if(!d||!d.dataset||!d.dataset.lk)return;
  st.lopen=st.lopen||{};if(d.open)st.lopen[d.dataset.lk]=1;else delete st.lopen[d.dataset.lk];save();
},true);
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!$("sheet").hidden){$("sheet").hidden=true;return;}
  if(view!=="practice"||!$("sheet").hidden)return;
  var tg=e.target&&e.target.tagName;if(tg==="SUMMARY"||tg==="INPUT")return;
  if(picked===null&&cur&&/^[1-4]$/.test(e.key)){var i=+e.key-1;if(i<cur.o.length)answer(i);}
  else if(cur&&picked!==null&&(e.key==="Enter"||e.key===" "||e.key==="ArrowRight")){e.preventDefault();advance();}
});
var applying=false;
function applyTheme(){
  var th=st.theme||"dark",root=document.documentElement;applying=true;
  if(th==="auto"){var dark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;root.setAttribute("data-theme",dark?"dark":"light");}
  else root.setAttribute("data-theme",th);
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",root.getAttribute("data-theme")==="dark"?"#0c1a13":"#e9f0eb");
  applying=false;
}
try{new MutationObserver(function(){if(!applying){var want=st.theme==="auto"?null:(st.theme||"dark");if(want&&document.documentElement.getAttribute("data-theme")!==want)applyTheme();}}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});}catch(e){}
try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(st.theme==="auto"){applyTheme();render();}});}catch(e){}
applyTheme();
next();
</script>
